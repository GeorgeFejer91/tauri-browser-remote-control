name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/starter/browser/package-lock.json
      - run: rustup toolchain install 1.74.0 --profile minimal
      - run: rustup component add rustfmt clippy --toolchain 1.74.0
      - run: python3 scripts/check_repository.py
      - run: python3 -m unittest discover -s tests -v
      - run: cargo +1.74.0 fmt --all --manifest-path assets/starter/rust/Cargo.toml -- --check
      - run: cargo +1.74.0 clippy --locked --all-targets --manifest-path assets/starter/rust/Cargo.toml -- -D warnings
      - run: cargo +1.74.0 test --locked --manifest-path assets/starter/rust/Cargo.toml
      - run: npm --prefix assets/starter/browser ci --ignore-scripts
      - run: npm --prefix assets/starter/browser test
